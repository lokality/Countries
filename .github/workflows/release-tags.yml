name: Create release tags

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create annotated tags
        run: |
          set -euo pipefail
          # v1.0.0 = pre-existing baseline (last 2019 commit)
          git tag -a v1.0.0 b240c113f6035426bf04332119cf98d825e1b0a6 -m "v1.0.0" || echo "v1.0.0 already exists"
          # v1.1.0 = modernization merge commit
          git tag -a v1.1.0 9da3291d39b478b71b3abf58c00bf7b548cf54cc -m "v1.1.0" || echo "v1.1.0 already exists"
          git push origin v1.0.0 v1.1.0

      - name: Create GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0 \
            --title "v1.0.0" \
            --notes "Initial release baseline: Country and Province enums with ISO codes, names, Codable support, countryFromURL(), and CustomStringConvertible conformance." \
            || echo "release v1.0.0 already exists"
          gh release create v1.1.0 \
            --title "v1.1.0" \
            --notes "Minor release: modernized country data (North Macedonia, Eswatini, Türkiye, Czechia, Cabo Verde), fixed data bugs (PS code, truncated names, Guinea-Bissau, British Virgin Islands lookup), added South Sudan/Curaçao/Sint Maarten/Bonaire, and refreshed tooling. See CHANGELOG.md for details." \
            || echo "release v1.1.0 already exists"
