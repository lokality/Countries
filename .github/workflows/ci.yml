name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  test:
    name: Build & Test (Swift on Linux)
    runs-on: ubuntu-latest
    container: swift:5.9
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test -v
